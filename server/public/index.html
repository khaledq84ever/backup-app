<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backup App</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 20px; min-height: 100vh;
    background: #0A0A0F; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  .wrap { width: 100%; max-width: 560px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .sub { color: #8B8B96; font-size: 14px; margin-bottom: 28px; }
  .card {
    background: #13131A; border: 1px solid #1F1F2E; border-radius: 14px;
    padding: 20px; margin-bottom: 16px;
  }
  a.dl {
    display: block; text-align: center; text-decoration: none;
    background: #F59E0B; color: #0A0A0F; font-weight: 700;
    padding: 14px; border-radius: 10px; font-size: 16px;
  }
  a.dl:hover { opacity: .9; }
  .devices { font-size: 13px; color: #8B8B96; }
  .device-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1F1F2E; }
  .device-row:last-child { border-bottom: none; }
  .device-row b { color: #fff; }
  code { color: #F59E0B; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Backup App</h1>
  <div class="sub">Full device backup — photos, videos, contacts, SMS &amp; files</div>

  <div class="card">
    <a class="dl" href="/backupapp.apk">⬇ Download APK</a>
  </div>

  <div class="card">
    <div class="devices" id="devices">Loading devices…</div>
  </div>
</div>
<script>
async function load() {
  const el = document.getElementById('devices');
  try {
    const r = await fetch('/api/devices');
    const { devices } = await r.json();
    if (!devices.length) { el.textContent = 'No backups received yet.'; return; }
    el.innerHTML = '';
    for (const d of devices) {
      const sr = await fetch('/api/status/' + encodeURIComponent(d));
      const { status } = await sr.json();
      const totalFiles = Object.values(status).reduce((a, s) => a + s.files, 0);
      const totalBytes = Object.values(status).reduce((a, s) => a + s.bytes, 0);
      const row = document.createElement('div');
      row.className = 'device-row';
      row.innerHTML = `<span><b>${d}</b></span><span>${totalFiles} files, ${(totalBytes/1e6).toFixed(1)} MB</span>`;
      el.appendChild(row);
    }
  } catch (e) {
    el.textContent = 'Could not load status.';
  }
}
load();
</script>
</body>
</html>
