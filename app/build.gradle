apply plugin: 'com.android.application'

android {
    namespace "com.khaled.backupapp"
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.khaled.backupapp"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 15
        versionName "1.14"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.core:core:1.9.0'
}
