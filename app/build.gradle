apply plugin: 'com.android.application'

// BACKUP_KEY is the shared secret the app sends to the server on every
// upload. It's read from local.properties (gitignored) instead of being
// hardcoded here, since this repo is public - a key baked into committed
// source would be visible to anyone on GitHub, defeating the point.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def backupKey = localProps.getProperty('BACKUP_KEY', '')

android {
    namespace "com.khaled.backupapp"
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.khaled.backupapp"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 2
        versionName "1.1"
        buildConfigField "String", "BACKUP_KEY", "\"${backupKey}\""
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.core:core:1.9.0'
}
